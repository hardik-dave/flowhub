# Local dev environment per SPEC.md §10 global DoD.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports: ["5433:5432"]
    volumes: ["hubdb:/var/lib/postgresql/data"]
  # hubd service added by the builder once the binary exists:
  #   build: ./backend  ·  env_file: .env  ·  depends_on: [db]
volumes:
  hubdb:
