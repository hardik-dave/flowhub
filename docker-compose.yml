# Local dev environment per SPEC.md §10 global DoD.
# Host port 3307: the dev machine's native MySQL 8 owns 3306 (DECISIONS.md).
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: hub
      MYSQL_USER: hub
      MYSQL_PASSWORD: hub
      MYSQL_DATABASE: flowhub
    ports: ["3307:3306"]
    volumes: ["hubdb:/var/lib/mysql"]
  # hubd service added by the builder once the binary exists:
  #   build: ./backend  ·  env_file: .env  ·  depends_on: [db]
volumes:
  hubdb:
  dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm i --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - db
