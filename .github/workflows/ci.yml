# CI for the flowhub standalone repository (live as of 2026-10-08).
#
# MySQL 8 service: DB-gated tests read HUB_TEST_DATABASE_URL and skip
# cleanly when it is unset, so pure unit tests never depend on it.
name: hub CI

on:
  push:
  pull_request:

jobs:
  go:
    name: fmt + vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flowhub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      HUB_TEST_DATABASE_URL: root:root@tcp(127.0.0.1:3306)/flowhub?parseTime=true&loc=UTC&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
