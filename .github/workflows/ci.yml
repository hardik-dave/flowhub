# CI for hub AS A STANDALONE REPOSITORY.
#
# INERT while hub lives inside the fintech-flowos integration repo — GitHub only
# reads workflows from the repository root's .github/workflows/. This exists so
# the folder arrives as its own repo with a working merge gate.
#
# Keep it in step with the hub half of the `go` job in the integration repo's
# root ci.yml.
name: hub CI

on:
  push:
  pull_request:

jobs:
  go:
    name: fmt + vet + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
